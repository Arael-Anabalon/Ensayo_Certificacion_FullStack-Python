{% extends 'base.html' %}
{% block contenido %}
<div class="container mt-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Autores Registrados</h2>
        <a href="/autores/nuevo" class="btn btn-primary shadow-sm">Agregar Autor</a>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle m-0">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Correo Electronico</th>
                    <th class="text-end">Accion</th>
                </tr>
            </thead>
            <tbody>
                {% for autor in autores %}
                <tr>
                    <td class="fw-semibold text-dark">{{ autor.nombre }}</td>
                    <td class="text-secondary">{{ autor.email }}</td>
                    <td class="text-end">
                        <a href="/autores/eliminar/{{ autor.id }}" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('¿Quieres eliminar este autor?')">Eliminar</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center py-4 text-muted">No hay autores registrados en el sistema.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
