{% extends 'base.html' %}
{% block contenido %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="text-center mb-4 fw-bold text-primary">Registrar Nuevo Genero</h3>
                <form action="/generos/nuevo" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Genero</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej. Ciencia Ficcion, Terror"
                            required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Descripcion</label>
                        <input type="text" name="descripcion" class="form-control"
                            placeholder="Breve descripcion del genero" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Guardar Genero</button>
                        <a href="/generos" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
