{% extends 'base.html' %}
{% block contenido %}
<div class="container mt-2">
    <h2 class="fw-bold mb-4 text-danger">Mis Libros Favoritos</h2>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle m-0">
            <thead class="table-dark">
                <tr>
                    <th>Titulo del Libro</th>
                    <th>Autor</th>
                    <th class="text-end">Accion</th>
                </tr>
            </thead>
            <tbody>
                {% for fav in favoritos %}
                <tr>
                    <td class="fw-semibold text-dark">{{ fav.nombre_libro }}</td>
                    <td class="text-secondary">{{ fav.nombre_autor }}</td>
                    <td class="text-end">
                        <a href="/favoritos/eliminar/{{ fav.id }}" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('¿Quitar de favoritos?')">Quitar</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center py-4 text-muted">Aun no has agregado libros a tu lista de
                        favoritos.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
