{% extends 'base.html' %}
{% block contenido %}
<div class="container mt-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Generos Literarios</h2>
        <a href="/generos/nuevo" class="btn btn-primary shadow-sm">Agregar Genero</a>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle m-0">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th class="text-end">Accion</th>
                </tr>
            </thead>
            <tbody>
                {% for genero in generos %}
                <tr>
                    <td class="fw-semibold text-dark">{{ genero.nombre }}</td>
                    <td class="text-secondary">{{ genero.descripcion }}</td>
                    <td class="text-end">
                        <a href="/generos/eliminar/{{ genero.id }}" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('¿Quieres eliminar este genero?')">Eliminar</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center py-4 text-muted">No hay generos registrados en el sistema.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
