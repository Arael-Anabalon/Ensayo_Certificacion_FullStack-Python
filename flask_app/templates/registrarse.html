{% extends 'base.html' %}

{% block title %}Registrarse - BookHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="card-title text-center mb-4">Crear Cuenta</h2>
            <form action="{{ url_for('usuarios.login_registro') }}" method="POST">
                <input type="hidden" name="accion" value="registro">

                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Apellido:</label>
                    <input type="text" class="form-control" name="apellido" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico:</label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" name="contrasena" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirmar Contraseña:</label>
                    <input type="password" class="form-control" name="confirmar_contrasena" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Registrarse</button>
            </form>
            <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a
                    href="{{ url_for('usuarios.login_registro') }}">Inicia sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
